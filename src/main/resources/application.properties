spring.application.name=chama

# Local development reads secrets from a git-ignored .env file in the project
# root (see .env.example). In production the same names are real environment
# variables.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/chama}
spring.datasource.username=${DB_USERNAME:chama}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Admin account created on first start, only if there are no users yet.
chama.admin.username=${ADMIN_USERNAME:}
chama.admin.password=${ADMIN_PASSWORD:}
chama.timezone=Africa/Nairobi

# Business settings (see docs/decisions.md)
chama.contribution.mmf-amount=2000
chama.contribution.mgr-amount=1500
chama.contribution.due-day=10
# Months are tracked from here; balances before it come in as opening balances.
chama.cutover-month=2026-10
chama.goal-amount=250000

# Loan policy (brief 4.4). The rate is copied onto each loan when disbursed, so
# changing these never alters loans already out.
chama.loan.shares-multiple=3
chama.loan.per-loan-cap-percent=50
chama.loan.total-cap-percent=60
chama.loan.guarantor-min-shares=20000
chama.loan.one-guarantor-above=20000
chama.loan.two-guarantors-above=35000
chama.loan.due-soon-days=7
chama.loan.rates.two-weeks=1.5
chama.loan.rates.one-month=3
chama.loan.rates.up-to-three-months=5
chama.loan.rates.up-to-six-months=8
# Late payments. The loan policy shared with the group says no grace period (0);
# 5 days is the recorder's proposal to raise with the group (see decisions.md).
chama.loan.grace-days=5
chama.loan.late-fee-minimum=500
chama.loan.late-fee-percent=5

# Statement uploads for fund earnings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
