<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' · Chama'">Chama</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<header th:fragment="header(active)" class="site-header">
	<div class="band-inner">
		<a class="brand" th:href="@{/}">Family Chama</a>
		<nav sec:authorize="isAuthenticated()">
			<a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'current'"
			   th:attr="aria-current=${active == 'dashboard'} ? 'page'">Dashboard</a>
			<a th:href="@{/contributions}" th:classappend="${active == 'contributions'} ? 'current'"
			   th:attr="aria-current=${active == 'contributions'} ? 'page'">Contributions</a>
			<a th:href="@{/loans}" th:classappend="${active == 'loans'} ? 'current'"
			   th:attr="aria-current=${active == 'loans'} ? 'page'">Loans</a>
			<a th:href="@{/members}" th:classappend="${active == 'members'} ? 'current'"
			   th:attr="aria-current=${active == 'members'} ? 'page'">Members</a>
			<a th:href="@{/fund-earnings}" th:classappend="${active == 'pool'} ? 'current'"
			   th:attr="aria-current=${active == 'pool'} ? 'page'">Pool</a>
			<a th:href="@{/ledger}" th:classappend="${active == 'ledger'} ? 'current'"
			   th:attr="aria-current=${active == 'ledger'} ? 'page'">Ledger</a>
			<a th:href="@{/decisions}" th:classappend="${active == 'decisions'} ? 'current'"
			   th:attr="aria-current=${active == 'decisions'} ? 'page'">Decisions</a>
			<form th:action="@{/logout}" method="post" class="inline">
				<button type="submit" class="link-button">Log out</button>
			</form>
		</nav>
	</div>
</header>

<div th:fragment="flash" th:if="${message}" class="flash" th:text="${message}">Saved.</div>

<div th:fragment="error" th:if="${error}" class="alert alert-red" th:text="${error}">Something went wrong.</div>

<!--/* Payment method: a real dropdown plus "Other…" for anything else (see app.js).
     The select is named directly so the form still works if the script doesn't load. */-->
<div th:fragment="methodPicker(value, methods)" class="method-picker" data-method-picker>
	<select name="method" data-name="method" required>
		<option value="">Choose…</option>
		<option th:each="m : ${methods}" th:value="${m}" th:text="${m}" th:selected="${m == value}">M-Pesa</option>
		<option value="__other" th:selected="${value != null and value != '' and !methods.contains(value)}">Other…</option>
	</select>
	<input type="text" maxlength="50" placeholder="How was it paid?" hidden
		   th:value="${value != null and !methods.contains(value)} ? ${value}">
</div>

<!--/* The group decision behind an action (decision G1). The form needs enctype="multipart/form-data". */-->
<fieldset th:fragment="decisionFields" class="decision">
	<legend>Group decision</legend>
	<div class="grid-2">
		<label>Date decided
			<input type="date" name="decidedOn" th:value="${decision?.decidedOn} ?: ${#temporals.createToday()}">
		</label>
		<label>How the group agreed
			<input type="text" name="howAgreed" maxlength="300" required th:value="${decision?.howAgreed}"
				   placeholder="e.g. WhatsApp vote, 6 of 7 in favour">
		</label>
	</div>
	<label>Why (optional)
		<input type="text" name="reason" maxlength="1000" th:value="${decision?.reason}">
	</label>
	<label>Evidence (optional)
		<input type="file" name="evidence" accept="application/pdf,image/png,image/jpeg">
		<span class="hint">For example a screenshot of the vote. PDF, PNG or JPEG.</span>
	</label>
</fieldset>

<span th:fragment="status(s)" th:if="${s.label != ''}" class="badge"
	  th:classappend="'badge-' + ${s.tone}" th:text="${s.label}">Paid</span>

</body>
</html>
