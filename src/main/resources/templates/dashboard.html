<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('dashboard')}"></header>
<section class="hero">
	<div class="band-inner">
		<p class="eyebrow" th:text="${#temporals.format(month, 'MMMM yyyy')}">October 2026</p>
		<h1 th:text="|${greeting}, ${name}|">Good evening, Lilian</h1>
		<p class="lede" th:text="${activeMembers == 1} ? '1 active member.' : |${activeMembers} active members.|">7 active members.</p>
	</div>
</section>
<main class="page">
	<div class="stat-grid">
		<div class="card">
			<p class="stat-label">Members</p>
			<p class="stat-value" th:text="${activeMembers}">7</p>
		</div>
		<div class="card">
			<p class="stat-label">Contributions</p>
			<span class="pill">Coming soon</span>
		</div>
		<div class="card">
			<p class="stat-label">MMF pool</p>
			<span class="pill">Coming soon</span>
		</div>
	</div>

	<div class="card notice">
		<div class="notice-body">
			<h2 class="notice-title">More is on the way</h2>
			<p class="muted">Contributions, the MMF pool, loans and the merry-go-round arrive in the next phases.</p>
		</div>
		<a class="button primary" th:href="@{/members}">Manage members</a>
	</div>
</main>
</body>
</html>
