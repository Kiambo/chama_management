<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Opt-out')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('contributions')}"></header>
<main class="page narrow">
	<nav class="crumbs" aria-label="You are here">
		<a th:href="@{/}">Dashboard</a>
		<a th:href="@{/contributions(month=${row.month})}">Contributions</a>
		<span aria-current="page" th:text="|Opt-out for ${row.member.fullName}|">x</span>
	</nav>
	<p class="eyebrow" th:text="${@fmt.month(row.month)}">October 2026</p>
	<h1 th:text="|Opt-out for ${row.member.fullName}|">Opt-out</h1>
	<p class="muted">Opting out is chosen month by month. An opted-out part is not owed and doesn't count as missed.</p>

	<div th:replace="~{fragments/layout :: error}"></div>

	<form th:action="@{/contributions/opt-out}" method="post" class="stack">
		<input type="hidden" name="memberId" th:value="${row.member.id}">
		<input type="hidden" name="month" th:value="${row.month}">

		<label class="check">
			<input type="checkbox" name="savings" value="true" th:checked="${row.optedOutSavings()}">
			Opt out of savings (MMF) this month
		</label>
		<label class="check">
			<input type="checkbox" name="mgr" value="true" th:checked="${row.optedOutMgr()}">
			Opt out of the merry-go-round this month
		</label>
		<p class="hint">Opting out of the MGR in any month loses this member's turn for the round. That rule is enforced once the rotation is added (Phase 5).</p>

		<label>Note
			<input type="text" name="note" maxlength="500" th:value="${row.optOut != null} ? ${row.optOut.note}">
		</label>

		<div class="actions">
			<button type="submit" class="button primary">Save</button>
			<a class="button" th:href="@{/contributions(month=${row.month})}">Cancel</a>
		</div>
	</form>
</main>
</body>
</html>
