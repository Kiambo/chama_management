<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Extend a loan')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('loans')}"></header>
<main class="page narrow">
	<nav class="crumbs" aria-label="You are here">
		<a th:href="@{/}">Dashboard</a>
		<a th:href="@{/loans}">Loans</a>
		<a th:href="@{/loans/{id}(id=${v.loan.id})}" th:text="|${v.borrower.fullName}'s loan|">Loan</a>
		<span aria-current="page">Extend</span>
	</nav>
	<p class="eyebrow">Extend a loan</p>
	<h1 th:text="|${v.borrower.fullName}'s loan|">Name's loan</h1>
	<p class="muted" th:text="|Now ${v.loan.tenure.label} at ${v.loan.ratePercent.stripTrailingZeros().toPlainString()}% flat (KES ${@fmt.amount(v.loan.interest)} interest). The fee moves to the tier for the new total tenure; what's left is spread over the months up to the new end date.|">Now 3 months at 5%</p>

	<div th:replace="~{fragments/layout :: error}"></div>

	<form th:action="@{/loans/{id}/extend(id=${v.loan.id})}" method="post" enctype="multipart/form-data" class="stack">
		<label>New total tenure
			<select name="tenure" required>
				<option value="">Choose…</option>
				<option th:each="t : ${tenures}" th:value="${t}"
						th:text="|${t.label} (${t.tierLabel()}) · +KES ${@fmt.amount(loanDecisions.extraInterestFor(v.loan, t))} interest|">5 months</option>
			</select>
		</label>
		<fieldset th:replace="~{fragments/layout :: decisionFields}"></fieldset>
		<div class="actions">
			<button type="submit" class="button primary">Extend</button>
			<a class="button" th:href="@{/loans/{id}(id=${v.loan.id})}">Cancel</a>
		</div>
	</form>
</main>
</body>
</html>
