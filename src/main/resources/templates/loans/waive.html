<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Waive a late fee')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('loans')}"></header>
<main class="page narrow">
	<nav class="crumbs" aria-label="You are here">
		<a th:href="@{/}">Dashboard</a>
		<a th:href="@{/loans}">Loans</a>
		<a th:href="@{/loans/{id}(id=${v.loan.id})}" th:text="|${v.borrower.fullName}'s loan|">Loan</a>
		<span aria-current="page">Waive a late fee</span>
	</nav>
	<p class="eyebrow">Waive a late fee</p>
	<h1 th:text="|${@fmt.kes(v.feeOwedOn(fee))} on ${v.borrower.fullName}'s loan|">KES 500</h1>
	<p class="muted">The fee stays in the history, marked waived, and is no longer owed.</p>

	<div th:replace="~{fragments/layout :: error}"></div>

	<form th:action="@{/loans/{id}/fees/{fid}/waive(id=${v.loan.id}, fid=${fee.id})}" method="post"
		  enctype="multipart/form-data" class="stack">
		<fieldset th:replace="~{fragments/layout :: decisionFields}"></fieldset>
		<div class="actions">
			<button type="submit" class="button primary">Waive the fee</button>
			<a class="button" th:href="@{/loans/{id}(id=${v.loan.id})}">Cancel</a>
		</div>
	</form>
</main>
</body>
</html>
