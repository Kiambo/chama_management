# Local development database. Reads DB_USERNAME / DB_PASSWORD from .env.
# Port 5433 so it doesn't clash with a Postgres already installed on 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: chama_postgres
    environment:
      POSTGRES_DB: chama
      POSTGRES_USER: ${DB_USERNAME:-chama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Africa/Nairobi
    ports:
      - "5433:5432"
    volumes:
      - chama_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chama} -d chama"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chama_pgdata:
